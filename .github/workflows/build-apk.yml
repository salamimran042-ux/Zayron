name: Build Zayron AI APK

on:
  push:
    branches:
      - main
      - zayron-ai-implementation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: JVM tests and Android debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Check out committed source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure preinstalled Android SDK
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install required Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"

      - name: Run JVM unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK from repository source
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Zayron-AI-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

  instrumentation:
    name: Android Keystore instrumentation tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out committed source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"

      - name: Run Android Keystore tests on lightweight emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb wait-for-device
            adb shell getprop sys.boot_completed
            adb shell getprop ro.build.version.sdk
            adb shell pm list packages >/dev/null
            gradle --no-daemon :app:connectedDebugAndroidTest

  verify-project-integrity:
    name: Zayron project identity and source checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out committed source
        uses: actions/checkout@v4

      - name: Verify required Android project files
        run: |
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/ai/zayron/client/MainActivity.kt

      - name: Verify official app identity
        run: |
          grep -Fq 'namespace = "ai.zayron.client"' app/build.gradle.kts
          grep -Fq 'applicationId = "ai.zayron.client"' app/build.gradle.kts
          grep -Fq 'android:label="Zayron AI"' app/src/main/AndroidManifest.xml
          echo "Zayron AI package, label, and required source files verified."
