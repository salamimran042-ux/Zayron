name: Build Zayron AI APK

on:
  push:
    branches:
      - main
      - zayron-ai-implementation
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: JVM tests and Android debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Check out committed source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure preinstalled Android SDK
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install required Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.4"

      - name: Run JVM unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK from repository source
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Zayron-AI-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

  instrumentation:
    name: Android Keystore instrumentation tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out committed source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.4"

      - name: Prebuild app and instrumentation APKs before emulator startup
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run Android Keystore tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none -memory 3072 -cores 2 -partition-size 2048
          disable-animations: true
          emulator-boot-timeout: 1800
          script: |
            adb wait-for-device
            for attempt in $(seq 1 12); do
              if adb shell cmd package list packages >/dev/null 2>&1; then
                echo "Android package manager is responding."
                break
              fi
              echo "Waiting for Android package manager (attempt $attempt/12)..."
              sleep 5
            done
            adb shell cmd package list packages >/dev/null
            gradle --no-daemon :app:connectedDebugAndroidTest -x :app:assembleDebug -x :app:assembleDebugAndroidTest

  verify-project-integrity:
    name: Zayron project identity and source checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out committed source
        uses: actions/checkout@v7

      - name: Verify required Android project files
        run: |
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/ai/zayron/client/MainActivity.kt

      - name: Verify official app identity
        run: |
          grep -Fq 'namespace = "ai.zayron.client"' app/build.gradle.kts
          grep -Fq 'applicationId = "ai.zayron.client"' app/build.gradle.kts
          grep -Fq 'android:label="Zayron AI"' app/src/main/AndroidManifest.xml
          echo "Zayron AI package, label, and required source files verified."
