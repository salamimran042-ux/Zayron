name: Build Zayron AI APK

on:
  push:
    branches:
      - main
      - zayron-ai-implementation
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zayron-ai-latest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-project-integrity:
    name: Zayron project identity and source checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out committed source
        uses: actions/checkout@v7

      - name: Verify required Android project files
        run: |
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/ai/zayron/client/MainActivity.kt

      - name: Verify official app identity
        run: |
          grep -Fq 'namespace = "ai.zayron.client"' app/build.gradle.kts
          grep -Fq 'applicationId = "ai.zayron.client"' app/build.gradle.kts
          grep -Fq 'android:label="Zayron AI"' app/src/main/AndroidManifest.xml
          echo "Zayron AI package, label, and required source files verified."

  backend:
    name: Python backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out committed source
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run backend tests
        run: python -m pytest

  build:
    name: JVM tests and Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Check out committed source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure preinstalled Android SDK
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install required Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.4"

      - name: Run JVM unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK from repository source
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Zayron-AI-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

  instrumentation:
    name: Android Keystore instrumentation tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out committed source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.4"

      - name: Prebuild app and instrumentation APKs before emulator startup
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run Android Keystore tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb wait-for-device
            adb shell 'i=0; until [ "$(getprop sys.boot_completed)" = "1" ] && cmd package list packages >/dev/null 2>&1; do i=$((i+1)); [ "$i" -lt 36 ] || exit 1; sleep 5; done'
            adb shell cmd package list packages >/dev/null
            # Best-effort verifier tuning on this disposable CI emulator only.
            # Keep each command independent so emulator setup cannot prevent instrumentation from starting.
            adb shell settings put global verifier_verify_adb_installs 0 || echo "::warning::Could not disable ADB install verification; continuing."
            adb shell settings put global package_verifier_enable 0 || echo "::warning::Could not disable package verification; continuing."
            adb shell settings put global verifier_timeout 0 || echo "::warning::Could not adjust verifier timeout; continuing."
            gradle --no-daemon :app:connectedDebugAndroidTest -x :app:assembleDebug -x :app:assembleDebugAndroidTest; test_status=$?; mkdir -p "$RUNNER_TEMP/zayron-instrumentation-diagnostics"; adb logcat -d -v threadtime > "$RUNNER_TEMP/zayron-instrumentation-diagnostics/logcat.txt" || true; find app/build/outputs -type f | grep -E 'androidTest-results|connected' | while IFS= read -r file; do cp --parents "$file" "$RUNNER_TEMP/zayron-instrumentation-diagnostics/"; done || true; exit "$test_status"
      - name: Preserve Android instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zayron-Android-Instrumentation-Diagnostics
          path: ${{ runner.temp }}/zayron-instrumentation-diagnostics/
          if-no-files-found: warn
          retention-days: 14

  backend-security-audit:
    name: Backend dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out committed source
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Prepare declared backend dependencies for audit
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          dependencies = list(project.get("dependencies", []))
          dependencies.extend(project.get("optional-dependencies", {}).get("dev", []))
          if not dependencies:
              raise SystemExit("No backend dependencies were found to audit.")
          requirements = Path(os.environ["RUNNER_TEMP"]) / "zayron-audit-requirements.txt"
          requirements.write_text("\n".join(dependencies) + "\n")
          print(f"Auditing {len(dependencies)} declared runtime and dev dependencies:")
          print(requirements.read_text())
          PY
          python -m pip install pip-audit

      - name: Audit declared backend dependencies
        run: python -m pip_audit --strict -r "$RUNNER_TEMP/zayron-audit-requirements.txt"

  database-migration-integrity:
    name: Database migration and RLS safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out committed source
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify the versioned migration set
        run: |
          count=$(find migrations -maxdepth 1 -type f -name '[0-9][0-9][0-9][0-9]_*.sql' | wc -l)
          test "$count" -eq 15
          test -z "${ZAYRON_MIGRATION_DATABASE_URL:-}"
          echo "Found $count versioned migrations; no live database connection is configured."

      - name: Test migration checksums and restricted database roles
        run: python -m pytest tests/test_migrations.py tests/test_database_roles.py tests/test_database_boundary.py

  chat-api-contract:
    name: Android and backend chat API contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out committed source
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend test dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"

      - name: Test authenticated backend chat request contract
        working-directory: backend
        run: python -m pytest tests/test_chat_routes.py

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.4"

      - name: Test Android chat serialization and streaming contract
        run: |
          gradle --no-daemon :app:testDebugUnitTest \
            --tests ai.zayron.client.data.chat.ChatStreamContractTest \
            --tests ai.zayron.client.data.chat.OkHttpChatRemoteDataSourceTest

  capability-routing:
    name: Six-capability routing and workspace checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out committed source
        uses: actions/checkout@v7

      - name: Verify capability workspace source files
        run: |
          test -f app/src/main/java/ai/zayron/client/ui/chat/ChatScreen.kt
          test -f app/src/main/java/ai/zayron/client/ui/tools/ToolWorkspaceScreen.kt
          test -f app/src/main/java/ai/zayron/client/ui/tools/DocumentAiScreen.kt
          test -f app/src/main/java/ai/zayron/client/ui/tools/ImageEditingScreen.kt
          test -f app/src/main/java/ai/zayron/client/ui/tools/VoiceAssistantScreen.kt
          grep -Fq 'IMAGE_TO_VIDEO' app/src/main/java/ai/zayron/client/data/skills/SkillIntentRouter.kt
          grep -Fq 'IMAGE_INPAINT_ERASER' app/src/main/java/ai/zayron/client/data/skills/SkillIntentRouter.kt
          grep -Fq 'DOCUMENT_AI' app/src/main/java/ai/zayron/client/data/skills/SkillIntentRouter.kt
          grep -Fq 'APP_BUILDER' app/src/main/java/ai/zayron/client/data/skills/SkillIntentRouter.kt
          grep -Fq 'VOICE_ASSISTANT' app/src/main/java/ai/zayron/client/data/skills/SkillIntentRouter.kt
          echo "Chat-first entry and all five specialist routing targets are present."

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.4"

      - name: Run capability intent routing unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --tests ai.zayron.client.data.skills.SkillIntentRouterTest

  release-configuration:
    name: Release configuration and signing safeguards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out committed source
        uses: actions/checkout@v7

      - name: Verify release signing uses protected environment variables
        run: |
          grep -Fq 'signingConfigs.getByName("release")' app/build.gradle.kts
          grep -Fq 'System.getenv("ZAYRON_RELEASE_STORE_PASSWORD")' app/build.gradle.kts
          grep -Fq 'System.getenv("ZAYRON_RELEASE_KEY_ALIAS")' app/build.gradle.kts
          grep -Fq 'System.getenv("ZAYRON_RELEASE_KEY_PASSWORD")' app/build.gradle.kts
          if git ls-files | grep -E '\.(jks|keystore|p12|pfx)$'; then
            echo "A signing keystore must never be committed."
            exit 1
          fi
          grep -Fq 'applicationId = "ai.zayron.client"' app/build.gradle.kts
          echo "Release signing is environment-based; no keystore is tracked."

  secret-scan:
    name: Repository secret exposure scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
