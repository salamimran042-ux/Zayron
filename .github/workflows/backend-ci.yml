name: Zayron AI Backend CI (manual only)

# Backend tests now run inside the unified Zayron AI build workflow.
# Keep this manual entry point for isolated diagnosis only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out committed source
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run backend tests
        run: python -m pytest
