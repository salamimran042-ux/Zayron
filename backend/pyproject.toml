[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zayron-api"
version = "0.2.0"
description = "Zayron AI backend foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "asyncpg>=0.29,<1.0",
  "PyJWT[crypto]>=2.9,<3.0",
  "httpx>=0.27,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "pypdf>=5.0,<7.0",
]

[project.scripts]
zayron-document-worker = "app.workers.document_worker:main"

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "pytest-asyncio>=1.3,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
